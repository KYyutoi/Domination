# 銃の設定ファイル
# damage: ダメージ量
# fire-rate: 連射速度（ティック単位、20tick = 1秒）
# magazine-size: 弾倉サイズ
# reload-time: リロード時間（ティック単位）
# projectile-speed: 弾速（高いほど速く遠くまで飛ぶ）
# spread: 拡散度（0=まっすぐ、大きいほど拡散）
# auto-fire: 自動連射（true/false）

guns:
  pistol:
    name: §7ピストル
    damage: 5.0
    fire-rate: 8
    magazine-size: 12
    reload-time: 40
    projectile-speed: 8.0
    spread: 0.0
    auto-fire: false
  

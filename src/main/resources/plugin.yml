name: Domination
version: '2.0.0'
main: io.github.LRGyutoi.domination.DominationPlugin
api-version: '1.21'
description: 拠点制圧型TPSゲームプラグイン（クリーンアーキテクチャ版）
author: LRGyutoi
website: https://github.com/LRGyutoi

commands:
  team:
    description: チーム管理コマンド
    usage: /team <join|leave|list> [チーム名]
    permission: domination.team

  weapon:
    description: 武器管理コマンド
    usage: /weapon <give|list|reload> [武器ID]
    permission: domination.weapon

  domination:
    description: ゲーム管理コマンド
    usage: /domination <start|stop|status|addpoint|removepoint|reset>
    permission: domination.admin
    aliases: [dom, game]

permissions:
  domination.team:
    description: チームコマンドを使用できる
    default: true

  domination.weapon:
    description: 武器コマンドを使用できる
    default: true

  domination.admin:
    description: ゲーム管理コマンドを使用できる
    default: op


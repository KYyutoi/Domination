# 銃の設定ファイル
# ===========================
# 基本ステータス:
#   damage: ダメージ量
#   fire-rate: 連射速度（ティック単位、20tick = 1秒）
#   magazine-size: 弾倉サイズ
#   reload-time: リロード時間（ティック単位）
#   projectile-speed: 弾速（ブロック/tick）
#   spread: 拡散度（0=まっすぐ、大きいほど拡散）
#   auto-fire: 自動連射（true/false）
#   pellets: 1発あたりの弾丸数（ショットガン用）
#
# 拡張ステータス:
#   headshot-multiplier: 銃固有のHS倍率（グローバル倍率に乗算）
#   range: 有効射程（ブロック）
#   move-speed-multiplier: 装備時の移動速度係数
# ===========================

guns:
  pistol:
    name: "§7ピストル"
    damage: 5.0
    fire-rate: 8
    magazine-size: 12
    reload-time: 40
    projectile-speed: 8.0
    spread: 0.0
    auto-fire: false
    headshot-multiplier: 1.0
    range: 50.0
    move-speed-multiplier: 1.0

  assault_rifle:
